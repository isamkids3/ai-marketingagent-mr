version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: millenium-postgres-db
    restart: always
    # This block binds your container's internal engine to your .env file
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - pg_radius_data:/var/lib/postgresql/data

volumes:
  pg_radius_data:
